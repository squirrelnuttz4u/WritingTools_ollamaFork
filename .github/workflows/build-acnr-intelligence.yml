name: Build ACNR Intelligence (Windows)

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - "claude/**"
  workflow_dispatch: {}

permissions:
  contents: write  # needed to create / upload release assets

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: Windows_and_Linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Windows_and_Linux/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python pyinstaller-build-script.py

      - name: Verify exe exists
        run: |
          if (-not (Test-Path "dist\ACNR Intelligence.exe")) {
              Get-ChildItem dist -Recurse
              throw "dist\ACNR Intelligence.exe missing after build"
          }
          Get-Item "dist\ACNR Intelligence.exe" | Format-List Name, Length, LastWriteTime

      - name: Stage release payload
        run: |
          $stage = "dist\ACNR-Intelligence-Windows"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "dist\ACNR Intelligence.exe" -Destination $stage -Force

          # Ship options.json (default action buttons) next to the exe.
          # The app reads it from os.path.join(app_dir(), 'options.json');
          # if it's missing the app falls back to the baked-in DEFAULT_OPTIONS
          # in WritingToolApp.py, but we ship the file so users can edit it
          # manually without opening the UI.
          Copy-Item "options.json" -Destination $stage -Force

          # Ship the ACNR wide-logo banner used by the popup header.
          if (Test-Path "acnr_logo.png") {
              Copy-Item "acnr_logo.png" -Destination $stage -Force
          } else {
              throw "acnr_logo.png is missing from the source - the popup header will be blank."
          }

          # Ship the icons/ directory. The popup, buttons, and tray icon all
          # load icons via app_dir()/icons/*.png at runtime.
          Copy-Item "icons" -Destination "$stage\icons" -Recurse -Force

          # Bundle the README so users have a readme in the zip
          if (Test-Path "..\outlook-ollama\README.md") {
              Copy-Item "..\outlook-ollama\README.md" -Destination "$stage\README.md" -Force
          }

          Write-Host "Staged contents:"
          Get-ChildItem $stage -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Build zip via .NET ZipFile (PowerShell Compress-Archive drops subdirs in some PS versions)
        run: |
          $stage = "dist\ACNR-Intelligence-Windows"
          $zipPath = "dist\ACNR-Intelligence-Windows.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
              (Resolve-Path $stage).Path,
              (Join-Path (Resolve-Path "dist").Path "ACNR-Intelligence-Windows.zip")
          )
          Get-Item $zipPath | Format-List Name, Length

      - name: Verify required files are in the zip
        run: |
          $zipPath = "dist\ACNR-Intelligence-Windows.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath).Path)
          try {
              $names = $zip.Entries | ForEach-Object { $_.FullName }
              Write-Host "Zip entries:"
              $names | Sort-Object | ForEach-Object { Write-Host "  $_" }

              $required = @(
                  "ACNR Intelligence.exe",
                  "options.json",
                  "acnr_logo.png",
                  "icons/app_icon.png"
              )
              $missing = @()
              foreach ($r in $required) {
                  $needle = $r.Replace("\", "/")
                  if (-not ($names -contains $needle)) {
                      $missing += $r
                  }
              }
              if ($missing.Count -gt 0) {
                  throw "Required files missing from zip: $($missing -join ', ')"
              }
              Write-Host "All required files present."
          } finally {
              $zip.Dispose()
          }

      - name: Upload build artifact (always - downloadable from Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: ACNR-Intelligence-Windows
          path: Windows_and_Linux/dist/ACNR-Intelligence-Windows.zip
          retention-days: 30

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Windows_and_Linux/dist/ACNR-Intelligence-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
